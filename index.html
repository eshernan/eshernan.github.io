<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Esteban Hernández's personal website.">
  <title>Esteban Hernández</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f6f8fa;
      color: #1f2328;
    }

    main {
      width: min(720px, calc(100% - 48px));
      padding: 64px;
      border: 1px solid #d0d7de;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(31, 35, 40, 0.1);
    }

    p:first-child {
      margin: 0 0 12px;
      color: #59636e;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .intro {
      max-width: 520px;
      margin: 28px 0 36px;
      font-size: 1.2rem;
      line-height: 1.7;
      color: #59636e;
    }

    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      background: #1f2328;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: #0969da;
    }

    @media (max-width: 600px) {
      main {
        padding: 36px 28px;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0d1117;
        color: #f0f6fc;
      }

      main {
        border-color: #30363d;
        background: #161b22;
        box-shadow: none;
      }

      p:first-child,
      .intro {
        color: #8b949e;
      }

      a {
        background: #f0f6fc;
        color: #0d1117;
      }
    }
  </style>
</head>
<body>
  <main>
    <p>Personal website</p>
    <h1>Hello, I'm Esteban.</h1>
    <p class="intro">
      Welcome to my corner of the web. This site is hosted with GitHub Pages.
    </p>
    <a href="https://github.com/eshernan">View my GitHub profile</a>
  </main>
</body>
</html>
